version: '3.8'

services:
  cajou-db:
    image: mysql:8.0
    container_name: cajou_market_db
    restart: always
    environment:
      MYSQL_DATABASE: cajou_market_db
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_USER: cajou_user
      MYSQL_PASSWORD: cajou_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  
  cajou-app:
    image: php:8.2-apache
    container_name: cajou_market_app
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    depends_on:
      - cajou-db

volumes:
  db_data: